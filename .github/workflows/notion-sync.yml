name: Notion UTM Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Sync redirects.json to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # 任意（既定で script 内に同じ名前が入る）:
          # NOTION_ISSUED_DATE_PROP: 発行日
          # NOTION_REGISTERED_AT_PROP: 登録日時   # 使わない場合は NOTION_REGISTERED_AT_PROP: ""
          # NOTION_ISSUER_PROP: 発行者
          # NOTION_ISSUER_TYPE: rich_text   # または select
          # NOTION_ISSUER_SELECT_NAME: GitHub自動同期   # select のとき DB にある選択肢名
        run: python scripts/notion_sync.py
